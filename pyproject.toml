# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name =  "netbox-device-view"
version = "0.2.0"
authors = [
    {name = "Peter Baumert", email = "noreply@github.com"},
    {name = "Joel Adria", email = "noreply@github.com"},
]
description = "Netbox Device View"
readme = "README.md"

classifiers=[
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]

requires-python = ">=3.10.0"

[project.optional-dependencies]
test = [
    "black==24.3.0",
    "check-manifest==0.49",
    "flake8",
    "flake8-pyproject",
    "pre-commit==3.7.0",
    "pytest==8.1.1",
]

[project.urls]
Documentation = "https://github.com/peterbaumert/netbox-device-view"
Source = "https://github.com/peterbaumert/netbox-device-view"
Tracker = "https://github.com/peterbaumert/netbox-device-view"

[tool.black]
line-length = 120
target_version = ['py39', 'py310', 'py311', 'py312']


[tool.setuptools.packages.find]
exclude = ["develop*"]


[tool.setuptools.package-data]
netbox_sheet_view = ["templates/**"]



[tool.poetry.group.dev.dependencies]
django = "5.1.8"
jinja2 = "3.1.6"
django-taggit = "6.1.0"
django-tables2 = "2.7.5"
djangorestframework = "3.16.0"
